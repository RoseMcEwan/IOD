<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="managedData.js" defer></script>
</head>
<body>

<main class = "container">
    <div class = "articleRepeat">
        <div class = "row g-4" id="containerRow"></div>
    </div>
</main>

<template id = "articleMain">
<div class="col-sm-12 mb-3 mb-sm-0 col-md-6 col-lg-3">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Special title treatment</h5>
        <p class="card-content">With supporting text below as a natural lead-in to additional content.</p>
      </div>
    </div>
</div>
</template>

<div class = "enterNews">
    <button id = "btn" type = button> Stop Reloading </button>

<div class = "input-group mb-3">
     <span class="input-group-text" id="basic-addon1">News Item Title:</span>
    <input id="title" type = "text" class ="form-control" placeholder="Title">
</div>
<div class = "input-group mb-3">
     <span class="input-group-text" id="basic-addon1">News Item Content: </span>
    <input id='content' type = "text" class ="form-control" placeholder="Content">
    <button class="btn btn-outline-secondary" type="button" id="button-addon2">Add News Item</button>
</div>
</div>

</body>
</html>
